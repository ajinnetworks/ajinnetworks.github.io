name: Site Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  jekyll-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Audit legacy post quality
        run: python3 scripts/audit_posts.py

      - name: Rank Phase 3.2 SEO rehabilitation
        run: python3 scripts/rank_seo_rehabilitation.py

      - name: Re-rank B2B commercial priority
        run: python3 scripts/commercial_rerank.py

      - name: Test B2B commercial rerank
        run: python3 scripts/test_commercial_rerank.py

      - name: Test Phase 3-6 conversion measurement
        run: python3 scripts/test_conversion_measurement.py

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace

      - name: Verify generated internal links
        run: python3 scripts/check_site_links.py
