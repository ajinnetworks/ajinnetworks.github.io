name: Auto Blog Post (주 3회 자동 발행)

on:
  # 매주 화·목·토 한국시간 09:00 (UTC 00:00)
  schedule:
    - cron: '0 0 * * 2'   # 화요일
    - cron: '0 0 * * 4'   # 목요일
    - cron: '0 0 * * 6'   # 토요일

  # 수동 실행 허용
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'once'
        type: choice
        options:
          - once        # 실제 발행
          - dry-run     # 초안만 생성

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: auto-blog-post-${{ github.repository }}
      cancel-in-progress: false
    env:
      BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
      BLOG_REPO: ajinnetworks/ajinnetworks.github.io
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 비어 있으면 agents/gemini_client.py가 실행 시 모델을 탐색 (Actions 변수로 고정 가능)
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      HUMAN_GATE: "false"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LOG_LEVEL: "INFO"

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          # 버전 고정: 미고정 설치로 google-genai가 바뀌며 호출 API가 v1beta→v1로 변한 전례가 있음 (2026-11)
          pip install anthropic==2.14.0 PyGithub==2.10.0 python-frontmatter==1.3.0 requests==2.34.2 PyYAML==6.0.4 python-dotenv==1.2.4 schedule==1.2.2 google-genai==3.6.1

      - name: 블로그 포스트 자동 생성 및 발행
        run: |
          MODE="${{ github.event.inputs.mode || 'once' }}"
          echo "실행 모드: $MODE"
          python scripts/run_agent.py --mode "$MODE" --platform github

      - name: 대표 그림 분포 점검 (한 그림 20% 초과 시 경고)
        # 발행은 GitHub API로 커밋되므로 최신 main을 받아 새 글까지 포함해 점검. 경고만 하고 실패시키지 않음
        id: hero_check
        if: success()
        continue-on-error: true
        run: |
          git pull --ff-only --quiet origin "${{ github.ref_name }}" || echo "::notice::최신 main을 받지 못해 체크아웃 시점 기준으로 점검합니다"
          python scripts/assign_hero_images.py --check --max-share 0.2 --request-file config/hero-split-request.md

      - name: 일러스트 추가 요청 PR 초안 (기준 초과 시)
        # 전용 브랜치에 요청서(근거)만 올려 초안 PR을 만든다. 이미 열려 있으면 브랜치만 갱신. main에는 쓰지 않음
        if: success() && steps.hero_check.outputs.over == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
          OVER_IMAGES: ${{ steps.hero_check.outputs.over_images }}
          BASE: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BR=auto/hero-split-request
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BR"
          git add config/hero-split-request.md
          git commit -q -m "chore(hero): illustration split request — ${OVER_IMAGES}"
          git -c http.https://github.com/.extraheader= push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BR}"
          OPEN=$(gh pr list --repo "$REPO" --head "$BR" --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --repo "$REPO" --body-file config/hero-split-request.md
            echo "::notice::기존 초안 PR #${OPEN} 갱신"
          else
            gh pr create --repo "$REPO" --draft --base "$BASE" --head "$BR" \
              --title "[초안] 대표 그림 반복 해소: ${OVER_IMAGES} 일러스트 추가 필요" \
              --body-file config/hero-split-request.md
          fi

      - name: 실행 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-logs-${{ github.run_number }}
          path: output/logs/
          retention-days: 30
